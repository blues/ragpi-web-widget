name: E2E (Playwright)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # test.html loads ./dist/ragpi-widget.js, so the specs exercise the build
      # output, not src/.
      - run: npm run build

      # webkit is not optional: mobile-responsive.spec.ts applies
      # devices['iPhone 12'] at file scope, and its defaultBrowserType is webkit.
      # Without it those 8 tests fail as a missing-executable error rather than
      # any real assertion.
      - run: npx playwright install --with-deps chromium webkit

      # playwright.config.ts starts the :8000 server itself.
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            test-results/
            screenshots/
          retention-days: 7
          if-no-files-found: ignore
