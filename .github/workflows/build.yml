name: Build Widget

on:
  push:
    branches: [main]

# Two main pushes can land inside one ~20s job window; without this both rebuild
# dist/ and race on git push, and the loser fails non-fast-forward.
concurrency:
  group: build-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is GitHub's 6h; p50 is 14s, max 44s.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit updated dist if changed
        run: |
          # The build now emits a code-split chunk alongside the entry, so stage
          # the whole dist/ (not just ragpi-widget.js) and detect changes there.
          git add -A dist/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update dist/"
          git push origin HEAD:main
