name: Build Widget

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit updated dist if changed
        run: |
          # The build now emits a code-split chunk alongside the entry, so stage
          # the whole dist/ (not just ragpi-widget.js) and detect changes there.
          git add -A dist/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update dist/"
          git push
